name: Build & deploy web

# Pushing to `release/web` builds the web app against the production Supabase
# project and publishes it to Firebase Hosting. Firebase is used only to serve
# the static files; swap the last step for any other static host if you prefer.
#
# Required repository configuration
#   Variables: SUPABASE_URL
#   Secrets:   SUPABASE_ANON_KEY (the publishable key),
#              FIREBASE_SERVICE_ACCOUNT_BESSIE_CAMP_APP
#   Optional:  secret SENTRY_DSN, plus SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT
#              to upload source maps.
# Database migrations are NOT run here; see db-migrate.yml.

on:
  push:
    branches:
      - release/web

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: bessie-web-${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # `secrets` can't be used in a step's `if`, so expose a flag instead.
      UPLOAD_SOURCEMAPS: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sentry needs the full history

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --exclude-tags integration

      - name: Build web
        run: >
          flutter build web --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          --dart-define=SENTRY_ENVIRONMENT=production
          --dart-define=RELEASE_VERSION=${{ env.RELEASE_VERSION }}

      - name: Prepare public folder
        run: |
          rm -rf public
          mv build/web public

      - name: Upload source maps to Sentry
        if: env.UPLOAD_SOURCEMAPS == 'true'
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          sourcemaps: public
          release: ${{ env.RELEASE_VERSION }}
          environment: production
          finalize: true

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BESSIE_CAMP_APP }}
          projectId: bessie-camp-app
          channelId: live

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Analyze, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --exclude-tags integration

  backend:
    name: Database tests and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Applies every migration and the seed to a fresh local stack.
      - run: supabase start -x studio
      - run: supabase db lint --level warning
      - run: supabase test db

      # The repositories against the real stack (RLS, RPCs, realtime).
      - run: flutter pub get
      - run: flutter test --tags integration

      - if: always()
        run: supabase stop --no-backup

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
